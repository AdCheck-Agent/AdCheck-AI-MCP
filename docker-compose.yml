services:
  ai-agent:
    build:
      context: .
      dockerfile: ai-agent/Dockerfile
    ports:
      - "${AI_AGENT_PORT:-8000}:8000"
    environment:
      AI_AGENT_PORT: 8000
      RAG_MCP_URL: http://rag-mcp:8001
      RAG_RETRIEVAL_ENABLED: "true"
      BUSINESS_MCP_URL: http://business-mcp:8002
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}
      REVIEW_TIMEOUT_SECONDS: ${REVIEW_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      rag-mcp:
        condition: service_healthy
      business-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  rag-mcp:
    build:
      context: .
      dockerfile: rag-mcp/Dockerfile
    ports:
      - "${RAG_MCP_PORT:-8001}:8001"
    environment:
      RAG_DATABASE_URL: postgresql://${RAG_DB_USER:-adcheck}:${RAG_DB_PASSWORD:-adcheck}@pgvector:5432/${RAG_DB_NAME:-adcheck_rag}
      RAG_MODEL_CACHE: /models
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - rag-models:/models
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  business-mcp:
    build:
      context: .
      dockerfile: business-mcp/Dockerfile
    ports:
      - "${BUSINESS_MCP_PORT:-8002}:8002"
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_TIMEOUT_SECONDS: ${TAVILY_TIMEOUT_SECONDS:-5}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS:-3}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  pgvector:
    image: pgvector/pgvector:pg18
    ports:
      - "${RAG_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${RAG_DB_USER:-adcheck}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-adcheck}
      POSTGRES_DB: ${RAG_DB_NAME:-adcheck_rag}
    volumes:
      - rag-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag-postgres:
  rag-models:
